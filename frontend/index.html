<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docutalk — Chat with your documents</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <svg
            class="logo-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="9" y1="13" x2="15" y2="13" />
            <line x1="9" y1="17" x2="15" y2="17" />
          </svg>
          <span class="logo-text">Docutalk</span>
        </div>

        <!-- Upload zone -->
        <div class="upload-section">
          <div
            class="drop-zone"
            id="dropZone"
            role="button"
            tabindex="0"
            aria-label="Upload a PDF or text file"
          >
            <svg
              class="upload-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <p class="drop-label">Drop a PDF or TXT here</p>
            <p class="drop-sub">or click to browse</p>
            <input type="file" id="fileInput" accept=".pdf,.txt" hidden />
          </div>

          <div class="upload-status" id="uploadStatus" hidden>
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-text" id="statusText"></div>
          </div>
        </div>

        <!-- Uploaded doc info -->
        <div class="doc-info" id="docInfo" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          <span id="docName" class="doc-name"></span>
        </div>

        <p class="sidebar-hint">
          Upload a document, then ask anything about it. Answers are grounded
          strictly in the document.
        </p>
      </aside>

      <!-- ── Main chat area ─────────────────────────────────────────────── -->
      <main class="chat-area">
        <div class="messages" id="messages">
          <div class="empty-state" id="emptyState">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              />
            </svg>
            <h2>Start a conversation</h2>
            <p>
              Upload a document on the left, then ask any question about it.
            </p>
          </div>
        </div>

        <div class="input-bar">
          <textarea
            id="questionInput"
            class="question-input"
            placeholder="Ask something about your document…"
            rows="1"
            disabled
          ></textarea>
          <button id="sendBtn" class="send-btn" disabled aria-label="Send">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
